<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrations Closed</title>
    <style>
        /* CSS Variables for consistent theming */
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Centered Wrapper */
        .wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Card Styling */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .card-image {
            width: 120px;
            height: auto;
            margin-bottom: 24px;
            border-radius: 12px;
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #111827;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        /* Button Styling */
        .btn-contact {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn-contact:hover {
            background-color: var(--primary-hover);
        }

        .btn-contact:active {
            transform: scale(0.98);
        }

        /* Footer Styling */
        footer {
            text-align: center;
            padding: 24px;
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <!-- Provided Image -->
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQRQUOVTVuLAWuWWCkcSow3IBBsUkVKziDB3e5VpyN02Q&s=10" alt="Registrations Closed" class="card-image">
            
            <h1>Registrations are Closed</h1>
            <p>We are currently not accepting any new registrations at this time. If you believe this is an error or need further assistance, please reach out to our administration team.</p>
            
            <!-- Replace mailto:admin@example.com with your actual admin email or contact page link -->
            <a href="mailto:admin@example.com" class="btn-contact">Contact Admin</a>
        </div>
    </div>

    <!-- Required Footer -->
    <footer>
        System was Designed & Developed by Xeta Tech Solutions
    </footer>

</body>
</html>
